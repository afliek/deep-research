    /* 四、三维分形噪声。在球面坐标上采样，天然消除经度接缝与极点断裂。 */
    function hash(x,y,z,seed) {
      let h = Math.imul(x,374761393) ^ Math.imul(y,668265263) ^ Math.imul(z,2147483647) ^ Math.imul(seed,1274126177);
      h = Math.imul(h ^ (h >>> 13),1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    }
    function noise(x,y,z,s) {
      const ix=Math.floor(x), iy=Math.floor(y), iz=Math.floor(z);
      const fx=x-ix, fy=y-iy, fz=z-iz;
      const a=fx*fx*(3-2*fx), b=fy*fy*(3-2*fy), c=fz*fz*(3-2*fz);
      const p=mix(hash(ix,iy,iz,s),hash(ix+1,iy,iz,s),a);
      const q=mix(hash(ix,iy+1,iz,s),hash(ix+1,iy+1,iz,s),a);
      const r=mix(hash(ix,iy,iz+1,s),hash(ix+1,iy,iz+1,s),a);
      const t=mix(hash(ix,iy+1,iz+1,s),hash(ix+1,iy+1,iz+1,s),a);
      return mix(mix(p,q,b),mix(r,t,b),c);
    }

      let sum=0, weight=0, amp=.5;
      for(let i=0;i<octaves;i++) {
        sum += noise(x,y,z,s+i*31)*amp; weight += amp;
        x*=2.03; y*=2.03; z*=2.03; amp*=.5;
      }
      return clamp((sum/weight-.5)*1.85+.5);
    }

      const p=clamp(t)*(colors.length-1), i=Math.min(colors.length-2,Math.floor(p));
      return colors[i].map((v,k)=>mix(v,colors[i+1][k],p-i));

      const tex = new BABYLON.RawTexture(bytes,w,h,BABYLON.Engine.TEXTUREFORMAT_RGBA,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
      tex.name=name; tex.gammaSpace=gamma;
      tex.wrapU=BABYLON.Texture.WRAP_ADDRESSMODE; tex.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;
      tex.anisotropicFilteringLevel=4;
      return tex;
    }
    function surface(cfg) {
      const w=cfg.id==="earth"||cfg.gas?1024:512, h=w/2;
      const pixels=new Uint8Array(w*h*4), relief=new Float32Array(w*h), rough=new Uint8Array(w*h*4);
      const clouds=cfg.id==="earth"?new Uint8Array(w*h*4):null;
      const seed=cfg.seed||3;
      for(let j=0;j<h;j++) {
        const lat=Math.PI*(j/(h-1)-.5), sy=Math.sin(lat), cr=Math.cos(lat);
        for(let i=0;i<w;i++) {
          const lon=TAU*i/w, x=cr*Math.cos(lon), z=cr*Math.sin(lon);
          const n=fbm(x*3.4+7,sy*3.4+9,z*3.4+5,seed);
          const fine=noise(x*95,sy*95,z*95,seed+1);
          let c, elevation=n, roughness=.87;
          if(cfg.id==="sun") {
            const granules=fbm(x*47,sy*47,z*47,19,3);
            const spot=smooth(.72,.88,n)*(1-smooth(.25,.6,Math.abs(sy)));
            c=palette([[170,43,6],[240,104,16],[255,179,62],[255,229,156]],granules*.68+n*.32);
            c=blend(c,[64,19,5],spot*.68);
          } else if(cfg.id==="earth") {
            const land=smooth(.51,.55,n), mountain=smooth(.62,.84,n);
            const ocean=blend([8,25,57],[18,74,110],smooth(.18,.53,n));
            const dry=smooth(.38,.67,fbm(x*5,sy*5,z*5,81,3))*(1-smooth(.28,.72,Math.abs(sy)));
            let ground=blend([33,75,42],[151,126,76],dry);
            ground=blend(ground,[149,145,125],mountain);
            c=blend(ocean,ground,land);
            const ice=smooth(.91,.98,Math.abs(sy)+.035*n);
            c=blend(c,[224,236,239],ice);
            elevation=land*(n-.51)*2; roughness=mix(.27,.92,Math.max(land,ice));
            const swirl=fbm(x*7+2*n,sy*7,z*7-2*n,95,4);
            const alpha=smooth(.53,.8,swirl)*.87;
            const k=(j*w+i)*4;
            clouds[k]=235; clouds[k+1]=242; clouds[k+2]=250; clouds[k+3]=alpha*255;
          } else if(cfg.gas) {
            const perturb=fbm(x*9+4,sy*9,z*9,seed+19,4);
            const band=.5+.5*Math.sin(sy*cfg.bands*Math.PI+(n-.5)*5+(perturb-.5)*1.8);
            const subtle=cfg.id==="uranus"?.24:cfg.id==="neptune"?.4:cfg.id==="venus"?.36:.85;
            c=palette(cfg.palette,clamp(.55+(band-.5)*subtle+(perturb-.5)*.23));
            if(cfg.id==="jupiter") {
              const dl=Math.atan2(Math.sin(lon-4.5),Math.cos(lon-4.5));
              const d=Math.hypot(dl/.24,(lat+.36)/.10);
              const storm=(1-smooth(.65,1.1,d))*.92;
              c=blend(c,palette([[126,60,36],[181,91,51],[214,141,89]],.5+.3*Math.sin(d*16+n*7)),storm);
            }
            elevation=perturb*.1; roughness=.94;
          } else {
            const crater=1-smooth(.035,.1,Math.abs(noise(x*34,sy*34,z*34,seed+8)-.48));
            c=palette(cfg.palette,clamp(n*.8+fine*.2-crater*.07));
            elevation=n*.5+fine*.1-crater*.055;
            if(cfg.id==="mars") c=blend(c,[225,224,218],smooth(.955,.995,Math.abs(sy)+n*.014));
          }
          const k=(j*w+i)*4;
          for(let ch=0;ch<3;ch++) pixels[k+ch]=clamp(c[ch]*(.97+fine*.06),0,255);
          pixels[k+3]=255; relief[j*w+i]=elevation;
          // 金属度贴图：R=遮蔽，G=粗糙度，B=金属度（此处均非金属）。
          rough[k]=255; rough[k+1]=roughness*255; rough[k+2]=0; rough[k+3]=255;
        }
      }
      const normals=new Uint8Array(w*h*4);
      for(let j=0;j<h;j++) for(let i=0;i<w;i++) {
        const dx=(relief[j*w+(i+1)%w]-relief[j*w+(i+w-1)%w])*.8;
        const dy=(relief[Math.min(h-1,j+1)*w+i]-relief[Math.max(0,j-1)*w+i])*.8;
        const len=Math.hypot(dx,dy,1), k=(j*w+i)*4;
        normals[k]=(-dx/len*.5+.5)*255; normals[k+1]=(-dy/len*.5+.5)*255; normals[k+2]=(1/len*.5+.5)*255; normals[k+3]=255;
      }
      return { color:makeRaw(cfg.id+"-albedo",pixels,w,h), normal:makeRaw(cfg.id+"-normal",normals,w,h,false), roughness:makeRaw(cfg.id+"-roughness",rough,w,h,false), clouds:clouds?makeRaw("earth-clouds",clouds,w,h):null };
    }

    /* 五、程序化 IBL。常量低照度立方图的全部 mip 本身就是预滤波结果。
       球谐多项式存放相同的漫反射环境，无需 HDR 下载、GPU 回读或跨域图片。 */
    function createEnvironment() {
      const size=16, color=[16,20,28];
      const faces=Array.from({length:6},()=>{
        const data=new Uint8Array(size*size*4);
        for(let i=0;i<data.length;i+=4) { data[i]=color[0]; data[i+1]=color[1]; data[i+2]=color[2]; data[i+3]=255; }
        return data;
      });
      const env=new BABYLON.RawCubeTexture(scene,faces,size,BABYLON.Engine.TEXTUREFORMAT_RGBA,BABYLON.Engine.TEXTURETYPE_UNSIGNED_BYTE,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
      env.name="程序化深空 IBL"; env.gammaSpace=false;
      const polynomial=new BABYLON.SphericalPolynomial();
      polynomial.addAmbient(new BABYLON.Color3(color[0]/255,color[1]/255,color[2]/255));
      env.sphericalPolynomial=polynomial;
      scene.environmentTexture=env; scene.environmentIntensity=.7;
    }

    /* 六、球形天幕：18,000 星点一次烘焙进画布，不创建上万个网格。 */
    function createStars() {
      const w=Math.min(4096,engine.getCaps().maxTextureSize), h=w/2;
      const texture=new BABYLON.DynamicTexture("star-atlas",{width:w,height:h},scene,false);
      const ctx=texture.getContext();
      ctx.fillStyle="#02040a"; ctx.fillRect(0,0,w,h);
      // 绘制极淡的银河带。经度跨边缘时重复绘制以连接球面接缝。
      for(let i=0;i<160;i++) {
        const x=Math.random()*w, y=h*(.5+.21*Math.sin(x/w*TAU+.5))+(Math.random()-.5)*h*.12;
        const radius=w*(.025+Math.random()*.035);
        for(const offset of [-w,0,w]) {
          const g=ctx.createRadialGradient(x+offset,y,0,x+offset,y,radius);
          g.addColorStop(0,"rgba(93,117,153,0.013)"); g.addColorStop(1,"rgba(25,35,62,0)");
          ctx.fillStyle=g; ctx.fillRect(x+offset-radius,y-radius,radius*2,radius*2);
        }
      }
      for(let i=0;i<18000;i++) {
        const x=Math.random()*w;
        // acos 采样让星点按球面面积均匀分布，而非挤在两极。
        const y=Math.acos(1-2*Math.random())/Math.PI*h;
        const power=Math.pow(Math.random(),4), alpha=.18+.82*power;
        const r=(.35+power*.9)*w/4096;
        const tint=Math.random(), rgb=tint<.14?"175,207,255":tint>.88?"255,223,188":"228,236,250";
        ctx.fillStyle=`rgba(${rgb},${alpha})`; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
        if(power>.91) {
          const g=ctx.createRadialGradient(x,y,0,x,y,r*5);
          g.addColorStop(0,`rgba(${rgb},.25)`); g.addColorStop(1,`rgba(${rgb},0)`);
          ctx.fillStyle=g; ctx.fillRect(x-r*5,y-r*5,r*10,r*10);
        }
      }
      texture.update(false);
      texture.wrapU=BABYLON.Texture.WRAP_ADDRESSMODE;
      texture.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;
      const sky=BABYLON.MeshBuilder.CreateSphere("star-dome",{diameter:2600,segments:24,sideOrientation:BABYLON.Mesh.BACKSIDE},scene);
      const mat=new BABYLON.StandardMaterial("star-light",scene);
      mat.disableLighting=true; mat.emissiveTexture=texture; mat.emissiveColor=BABYLON.Color3.Black();
      mat.diffuseColor=BABYLON.Color3.Black(); mat.specularColor=BABYLON.Color3.Black();
      sky.material=mat; sky.infiniteDistance=true; sky.isPickable=false;
    }

    /* 七、PBR 天体与土星环。父节点仅平移，轴倾角不会随公转方向进动。 */
    function createRing(body) {
      const w=4,h=1024, data=new Uint8Array(w*h*4);
      for(let j=0;j<h;j++) {
        const r=j/(h-1), band=.65+.22*Math.sin(r*193)+.13*Math.sin(r*487);
        const gap=1-.94*(smooth(.57,.585,r)-smooth(.635,.65,r));
        const alpha=smooth(0,.09,r)*(1-smooth(.85,1,r))*(1-r*.52)*band*gap;
        const c=palette([[97,81,62],[181,162,125],[231,216,184]],.4+band*.5);
        for(let i=0;i<w;i++) { const k=(j*w+i)*4; data[k]=c[0]; data[k+1]=c[1]; data[k+2]=c[2]; data[k+3]=alpha*245; }
      }
      const texture=makeRaw("saturn-radial-rings",data,w,h); texture.hasAlpha=true;
      const positions=[],uvs=[],indices=[],normals=[], segments=192;
      for(let i=0;i<=segments;i++) {
        const a=TAU*i/segments;
        for(const r of [body.cfg.radius*1.3,body.cfg.radius*2.35]) {
          positions.push(r*Math.cos(a),0,-r*Math.sin(a)); normals.push(0,1,0);
          uvs.push(i/segments,r===body.cfg.radius*1.3?0:1);
        }
        if(i<segments) { const k=i*2; indices.push(k,k+1,k+2,k+1,k+3,k+2); }
      }
      const ring=new BABYLON.Mesh("saturn-rings",scene), geometry=new BABYLON.VertexData();
      geometry.positions=positions; geometry.indices=indices; geometry.normals=normals; geometry.uvs=uvs; geometry.applyToMesh(ring);
      const mat=new BABYLON.PBRMaterial("icy-rings",scene);
      mat.albedoTexture=texture; mat.useAlphaFromAlbedoTexture=true;
      mat.transparencyMode=BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
      mat.metallic=0; mat.roughness=.92; mat.backFaceCulling=false; mat.twoSidedLighting=true;
      ring.material=mat; ring.parent=body.axis; ring.metadata={body}; ring.isPickable=false;
      body.ring=ring;
    }
    function flareTexture() {
      const c=document.createElement("canvas"); c.width=c.height=128;
      const ctx=c.getContext("2d"), g=ctx.createRadialGradient(64,64,0,64,64,64);
      g.addColorStop(0,"rgba(255,247,220,1)"); g.addColorStop(.12,"rgba(255,213,135,.65)"); g.addColorStop(.42,"rgba(255,170,81,.12)"); g.addColorStop(1,"rgba(255,160,65,0)");
      ctx.fillStyle=g; ctx.fillRect(0,0,128,128); return c.toDataURL("image/png");
    }
    function createBody(cfg,maps) {
      const anchor=new BABYLON.TransformNode(cfg.id+"-position",scene);
      const axis=new BABYLON.TransformNode(cfg.id+"-axis",scene);
      axis.parent=anchor; axis.rotation.z=radians(cfg.tilt);
      const mesh=BABYLON.MeshBuilder.CreateSphere(cfg.id,{diameter:cfg.radius*2,segments:cfg.radius>2?48:36},scene);
      mesh.parent=axis;
      const mat=new BABYLON.PBRMaterial(cfg.id+"-pbr",scene);
      mat.metallic=0; mat.roughness=.88; mat.albedoTexture=maps.color;
      mat.bumpTexture=maps.normal; mat.bumpTexture.level=cfg.gas?.22:.65;
      mat.metallicTexture=maps.roughness;
      mat.useRoughnessFromMetallicTextureAlpha=false; mat.useRoughnessFromMetallicTextureGreen=true;
      mat.useMetallnessFromMetallicTextureBlue=true;
      mesh.material=mat;
      const body={cfg,anchor,axis,mesh,angle:cfg.phase||0,spin:TAU/(14*Math.pow(cfg.day,.35)),label:null,button:null};
      mesh.metadata={body}; bodies.push(body);
      if(cfg.orbit) {
        positionBody(body);
        const points=Array.from({length:257},(_,i)=>new BABYLON.Vector3(cfg.orbit*Math.cos(TAU*i/256),0,-cfg.orbit*Math.sin(TAU*i/256)));
        const orbit=BABYLON.MeshBuilder.CreateLines(cfg.id+"-orbit",{points},scene);
        orbit.color=new BABYLON.Color3(.45,.56,.71); orbit.alpha=.19; orbit.isPickable=false;
        orbitMeshes.push(orbit);
      } else {
        mat.unlit=true; mat.albedoColor=BABYLON.Color3.Black();
        mat.emissiveTexture=maps.color; mat.emissiveColor=new BABYLON.Color3(2.3,1.8,1.25);
        const glow=new BABYLON.GlowLayer("solar-corona",scene,{mainTextureFixedSize:512,blurKernelSize:80});
        glow.intensity=.7; glow.addIncludedOnlyMesh(mesh);
        const flare=new BABYLON.LensFlareSystem("solar-optics",mesh,scene);
        flare.borderLimit=160;
        flare.meshesSelectionPredicate=m=>m!==mesh && !!m.metadata?.body && !m.name.includes("rings");
        const image=flareTexture();
        new BABYLON.LensFlare(.16,0,new BABYLON.Color3(1,.8,.5),image,flare);
        new BABYLON.LensFlare(.045,.38,new BABYLON.Color3(.55,.7,1),image,flare);
        new BABYLON.LensFlare(.075,.69,new BABYLON.Color3(.6,.72,1),image,flare);
        new BABYLON.LensFlare(.11,1.04,new BABYLON.Color3(1,.58,.25),image,flare);
      }
      if(cfg.ring) createRing(body);
      if(maps.clouds) {
        maps.clouds.hasAlpha=true;
        const cloud=BABYLON.MeshBuilder.CreateSphere("earth-cloud-shell",{diameter:cfg.radius*2.025,segments:36},scene);
        cloud.parent=mesh; cloud.isPickable=false;
        const cloudMat=new BABYLON.PBRMaterial("cloud-ice",scene);
        cloudMat.albedoTexture=maps.clouds; cloudMat.useAlphaFromAlbedoTexture=true;
        cloudMat.transparencyMode=BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
        cloudMat.metallic=0; cloudMat.roughness=1;
        cloud.material=cloudMat;
      }
      const label=document.createElement("span"); label.className="planet-label"; label.textContent=cfg.name;
      $("labels").appendChild(label); body.label=label;
      const button=document.createElement("button"); button.className="destination";
      button.style.setProperty("--body-color",cfg.color); button.setAttribute("aria-pressed","false");
      const dot=document.createElement("span"); dot.className="dot";
      button.append(dot,document.createTextNode(cfg.name)); button.onclick=()=>focusBody(body);
      $("destinations").appendChild(button); body.button=button;
    }
    function positionBody(body) { body.anchor.position.set(body.cfg.orbit*Math.cos(body.angle),0,-body.cfg.orbit*Math.sin(body.angle)); }

    /* 八、渲染管线。WebGPU 优先，能力不足时明确显示 WebGL 降级，绝不伪装后端。 */
    async function createEngine() {
      let candidate;
      try {
        if(!navigator.gpu || !isSecureContext || !await BABYLON.WebGPUEngine.IsSupportedAsync) throw new Error("当前环境不支持 WebGPU");
        candidate=new BABYLON.WebGPUEngine(canvas,{antialias:false,stencil:true,powerPreference:"high-performance"});
        await candidate.initAsync();
        $("renderer").textContent="WebGPU";
        return candidate;
      } catch(error) {
        if(candidate) candidate.dispose();
        console.warn("WebGPU 初始化失败，尝试 WebGL：",error);
        // WebGPU 上下文已绑定后不能改成 WebGL 上下文，使用新的画布节点。
        if(candidate) {
          const fresh=canvas.cloneNode(false); canvas.replaceWith(fresh);
        }
        const fallback=new BABYLON.Engine($("universe"),true,{stencil:true,powerPreference:"high-performance"},false);
        $("renderer").textContent=fallback.webGLVersion===2?"WebGL 2 · 降级":"WebGL · 降级";
        $("renderer").classList.add("warn");
        notify("WebGPU 不可用，已启用兼容渲染。要使用 WebGPU，请检查浏览器硬件加速；本地文件受限时改用 localhost。");
        return fallback;
      }
    }
    function homeRadius() {
      const aspect=engine.getRenderWidth()/engine.getRenderHeight();
      // 竖屏按较窄的视角扩大观察距离，确保最外层轨道仍在画面内。
      return Math.max(HOME.radius,105/(Math.tan(camera.fov/2)*aspect));
    }
    function createScene() {
      scene=new BABYLON.Scene(engine);
      scene.clearColor=new BABYLON.Color4(.002,.003,.007,1);
      scene.skipPointerMovePicking=true;
      camera=new BABYLON.ArcRotateCamera("observer",HOME.alpha,HOME.beta,HOME.radius,BABYLON.Vector3.Zero(),scene);
      camera.fov=.88; camera.radius=homeRadius(); camera.minZ=.03; camera.maxZ=5000;
      camera.lowerRadiusLimit=1.8; camera.upperRadiusLimit=1000;
      camera.lowerBetaLimit=.06; camera.upperBetaLimit=Math.PI-.06;
      camera.wheelDeltaPercentage=.025; camera.pinchDeltaPercentage=.025;
      camera.inertia=.78; camera.panningInertia=.72; camera.panningSensibility=55;
      camera.attachControl($("universe"),true,false,2);
      const sunLight=new BABYLON.PointLight("sunlight",BABYLON.Vector3.Zero(),scene);
      sunLight.diffuse=new BABYLON.Color3(1,.965,.91); sunLight.intensity=3.2;
      // 距离已被非线性压缩，照度采用艺术化衰减以兼顾内外行星可见性；BRDF 仍为 PBR。
      sunLight.falloffType=BABYLON.Light.FALLOFF_STANDARD; sunLight.range=700;
      createEnvironment();
      const image=scene.imageProcessingConfiguration;
      image.toneMappingEnabled=true; image.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
      image.exposure=1.1; image.contrast=1.08;
    }
    function createEffects() {
      // TAA 先处理线性场景颜色，再执行 Bloom 与 ACES 映射。
      if(BABYLON.TAARenderingPipeline && engine.getCaps().texelFetch) {
        try {
          taa=new BABYLON.TAARenderingPipeline("temporal-aa",scene,[camera]);
          if(!taa.isSupported) throw new Error("不支持 TAA 所需的渲染目标");
          taa.samples=8; taa.msaaSamples=1; taa.factor=.18;
          // 重投影与历史颜色钳制共同处理运动物体，避免仅检测相机造成拖影。
          if("reprojectHistory" in taa && "clampHistory" in taa && engine.getCaps().drawBuffersExtension) {
            taa.reprojectHistory=true; taa.clampHistory=true; taa.disableOnCameraMove=false;
          } else {
            taa.disableOnCameraMove=true; taa.factor=.32;
          }
        } catch(error) { console.warn("TAA 不可用：",error); if(taa) taa.dispose(); taa=null; }
      }
      pipeline=new BABYLON.DefaultRenderingPipeline("photographic",true,scene,[camera]);
      pipeline.samples=1; pipeline.bloomEnabled=true;
      pipeline.bloomThreshold=1.05; pipeline.bloomWeight=.23; pipeline.bloomKernel=64; pipeline.bloomScale=.5;
      pipeline.fxaaEnabled=!taa;
      if(!taa) {
        $("taa").checked=false; $("taa").disabled=true;
        $("aa-status").textContent="FXAA · 降级";
        notify("当前设备不支持 TAA，使用 FXAA 抗锯齿。");
      } else $("aa-status").textContent="TAA / 8 samples";
    }

    /* 九、交互：有终点的相机飞行 + 飞行结束后仅跟随位移，不锁住用户缩放。
       用户拖动或滚轮会打断飞行；右键平移解除跟随，避免每帧目标插值抢夺输入。 */
    function clearInertia() {
      camera.inertialAlphaOffset=0; camera.inertialBetaOffset=0; camera.inertialRadiusOffset=0;
      camera.inertialPanningX=0; camera.inertialPanningY=0;
    }
    function showDetails(body) {
      selected=body;
      for(const b of bodies) b.button.setAttribute("aria-pressed",String(b===body));
      const panel=$("details");
      panel.classList.toggle("open",!!body); panel.setAttribute("aria-hidden",String(!body)); panel.inert=!body;
      if(!body) return;
      const c=body.cfg;
      $("detail-title").textContent=c.name; $("detail-en").textContent=c.en; $("detail-kind").textContent=c.kind;
      $("description").textContent=c.desc; $("facts").replaceChildren();
      for(const [title,value] of c.facts) {
        const row=document.createElement("div"),dt=document.createElement("dt"),dd=document.createElement("dd");
        dt.textContent=title; dd.textContent=value; row.append(dt,dd); $("facts").appendChild(row);
      }
    }
    function beginFlight(body) {
      clearInertia(); following=null;
      const extent=body?body.cfg.radius*(body.cfg.ring?2.45:1.15):0;
      const narrowFov=2*Math.atan(Math.tan(camera.fov/2)*Math.min(1,engine.getAspectRatio(camera)));
      const radius=body?Math.max(3,extent/Math.sin(narrowFov/2)*1.6):homeRadius();
      // 从行星日照侧靠近，便于观察表面；终点每帧随目标的公转更新。
      const direction=body&&body.cfg.orbit?body.anchor.position.scale(-1).normalize():new BABYLON.Vector3(Math.cos(HOME.alpha),0,Math.sin(HOME.alpha));
      const alpha=body?Math.atan2(direction.z,direction.x)+.5:HOME.alpha;
      const delta=Math.atan2(Math.sin(alpha-camera.alpha),Math.cos(alpha-camera.alpha));
      flight={body,time:0,duration:reducedMotion?.05:1.8,fromTarget:camera.target.clone(),fromRadius:camera.radius,fromAlpha:camera.alpha,fromBeta:camera.beta,radius,alpha:camera.alpha+delta,beta:body?1.12:HOME.beta};
      camera.lowerRadiusLimit=body?Math.max(.8,extent*1.12):1.8;
    }
    function focusBody(body) {
      if(!ready) return;
      showDetails(body); beginFlight(body);
      $("view-status").textContent="接近 "+body.cfg.name;
    }
    function resetView() {
      if(!ready) return;
      showDetails(null); beginFlight(null); $("view-status").textContent="全局视图";
    }
    function interrupt(pan=false) {
      if(flight) { flight=null; following=null; }
      if(pan) following=null;
      if(!following) $("view-status").textContent="自由观察";
    }
    function bindUI() {
      const c=$("universe");
      c.addEventListener("contextmenu",event=>event.preventDefault());
      c.addEventListener("pointerdown",event=>interrupt(event.button===2));
      c.addEventListener("wheel",()=>interrupt(),{passive:true});
      scene.onPointerObservable.add(info=>{
        if(info.type!==BABYLON.PointerEventTypes.POINTERTAP || info.event.button!==0) return;
        const body=info.pickInfo?.pickedMesh?.metadata?.body;
        if(body) focusBody(body);
      });
      $("play").onclick=()=>{
        running=!running; $("play").textContent=running?"暂停运行":"继续运行";
        $("play").setAttribute("aria-label",running?"暂停公转和自转":"继续公转和自转");
        if(taa) taa.factor=running?.18:.09;
      };
      $("reset").onclick=resetView;
      $("close").onclick=()=>{ showDetails(null); $("universe").focus({preventScroll:true}); };
      $("speed").oninput=event=>{ speed=Number(event.target.value); $("speed-value").textContent=speed.toFixed(1)+"×"; };
      $("orbits").onchange=event=>orbitMeshes.forEach(m=>m.setEnabled(event.target.checked));
      $("names").onchange=event=>{ $("labels").hidden=!event.target.checked; };
      $("taa").onchange=event=>{
        if(!taa) return;
        taa.isEnabled=event.target.checked; pipeline.fxaaEnabled=!event.target.checked;
        $("aa-status").textContent=event.target.checked?"TAA / 8 samples":"FXAA";
      };
      window.addEventListener("keydown",event=>{
        if(event.target.closest("button,input,select,textarea") || event.repeat) return;
        if(event.code==="Space") { event.preventDefault(); $("play").click(); }
        if(event.code==="KeyR") resetView();
        if(event.code==="Escape") { showDetails(null); interrupt(true); }
      });
      window.addEventListener("resize",()=>{
        engine.resize();
        if(!selected&&!flight&&!following) camera.radius=homeRadius();
      });
    }

    /* 十、逐帧更新。噪声只在启动时计算；运动仅更新少量变换节点。 */
    const projectedLabels=[];
    function updateLabels() {
      if(!$("names").checked) return;
      projectedLabels.length=0;
      const width=engine.getRenderWidth(),height=engine.getRenderHeight();
      const viewport=camera.viewport.toGlobal(width,height), transform=scene.getTransformMatrix();
      const identity=BABYLON.Matrix.IdentityReadOnly;
      const rect=$("universe").getBoundingClientRect();
      const forward=camera.getForwardRay().direction;
      for(const body of bodies) {
        const position=body.anchor.position;
        const toBody=position.subtract(camera.globalPosition);
        const point=BABYLON.Vector3.Project(position,identity,transform,viewport);
        let visible=BABYLON.Vector3.Dot(toBody,forward)>0 && point.z>0 && point.z<1 && point.x>0 && point.x<width && point.y>0 && point.y<height;
        const x=point.x/width*rect.width,y=point.y/height*rect.height;
        const projectedRadius=body.cfg.radius/Math.max(.01,toBody.length())*rect.height/(2*Math.tan(camera.fov/2));
        const ly=y+projectedRadius+15;
        if(projectedLabels.some(p=>Math.abs(p.x-x)<45&&Math.abs(p.y-ly)<16)) visible=false;
        if(projectedRadius>rect.height*.3) visible=false;
        // 标签在太阳或其他行星后方时隐藏，避免透过天体显示。
        if(visible) {
          const distance=toBody.length();
          const ray=new BABYLON.Ray(camera.globalPosition,toBody.normalize(),Math.max(0,distance-body.cfg.radius));
          const hit=scene.pickWithRay(ray,m=>!!m.metadata?.body&&m.metadata.body!==body&&!m.name.includes("rings"));
          if(hit?.hit) visible=false;
        }
        body.label.style.display=visible?"block":"none";
        if(visible) { body.label.style.left=x+"px"; body.label.style.top=ly+"px"; projectedLabels.push({x,y:ly}); }
      }
    }
    function animate(dt) {
      for(const body of bodies) {
        if(running) {
          if(body.cfg.orbit) { body.angle=(body.angle+TAU/(60*body.cfg.year)*dt*speed)%TAU; positionBody(body); }
          body.mesh.rotation.y=(body.mesh.rotation.y+body.spin*dt*speed)%TAU;
        }
      }
      if(flight) {
        const f=flight; f.time+=dt;
        const t=clamp(f.time/f.duration), k=t*t*t*(t*(t*6-15)+10);
        const target=f.body?f.body.anchor.position:BABYLON.Vector3.ZeroReadOnly;
        camera.setTarget(BABYLON.Vector3.Lerp(f.fromTarget,target,k));
        camera.radius=mix(f.fromRadius,f.radius,k); camera.alpha=mix(f.fromAlpha,f.alpha,k); camera.beta=mix(f.fromBeta,f.beta,k);
        if(t===1) {
          following=f.body?{body:f.body,last:f.body.anchor.position.clone()}:null;
          $("view-status").textContent=f.body?"跟随 "+f.body.cfg.name:"全局视图";
          flight=null;
        }
      } else if(following) {
        const current=following.body.anchor.position;
        camera.target.addInPlace(current.subtract(following.last));
        following.last.copyFrom(current);
      }
      camera.panningSensibility=clamp(1100/camera.radius,7,450);
    }
    async function main() {
      await loadBabylon();
      $("loading-text").textContent="正在初始化 WebGPU 与显卡资源…";
      engine=await createEngine();
      // 限制高 DPI 屏幕的填充开销，不使用过高细分与逐帧程序化纹理。
      engine.setHardwareScalingLevel(1/Math.min(devicePixelRatio||1,1.5));
      createScene(); createStars();
      for(const cfg of catalog) {
        $("loading-text").textContent="正在生成 "+cfg.name+" 的程序化地表…";
        await yieldUI(); createBody(cfg,surface(cfg));
      }
      createEffects(); bindUI();
      $("loading-text").textContent="正在编译 PBR、TAA 与辉光着色器…";
      let frames=0,timer=0;
      engine.runRenderLoop(()=>{
        if(fatal) return;
        try {
          const dt=Math.min(engine.getDeltaTime()/1000,.05);
          if(ready&&!document.hidden) animate(dt);
          scene.render();
          if(ready) {
            if(frames++%3===0) updateLabels();
            timer+=dt; if(timer>.6) { $("fps").textContent=engine.getFps().toFixed(0)+" FPS"; timer=0; }
          }
        } catch(error) { fail(error); }
      });
      await Promise.race([scene.whenReadyAsync(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("场景着色器准备超时，请检查 GPU 或官方 CDN 连接")),60000))]);
      if(fatal) return;
      ready=true; $("play").disabled=false; $("reset").disabled=false;
      $("loading").classList.add("done");
    }
    main().catch(fail);
  })();
  </script>
</body>
